name: MLOps Pipeline

on:
  push:
    branches: [main]
    paths:
      - 'data/**.dvc'
      - 'src/**.py'
      - 'params.yaml'
  workflow_dispatch:

env:
  EVAL_THRESHOLD: "0.70"

jobs:

  # ---------------------------------------------------------------------------
  # JOB 1 - UNIT TEST
  # Chay unit tests tren du lieu ao (khong can ket noi cloud storage).
  # Neu co bat ky test nao that bai, pipeline dung lai o day va khong tien hanh
  # huan luyen hay trien khai.
  # ---------------------------------------------------------------------------
  test:
    name: Unit Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run unit tests
        run: pytest tests/ -v


  # ---------------------------------------------------------------------------
  # JOB 2 - TRAIN
  # Xac thuc S3, pull du lieu bang DVC, huan luyen mo hinh, upload artifact.
  # Model moi duoc dua vao models/candidate/ chu KHONG ghi de models/latest/.
  # Chi khi qua het cac cong o Job 3 thi Job 4 moi promote candidate len latest.
  # Nho vay mot model kem khong bao gio nam o vi tri ma VM se tai khi khoi dong.
  # Chi chay khi Job 1 (Unit Test) hoan thanh thanh cong.
  # ---------------------------------------------------------------------------
  train:
    name: Train
    needs: test
    runs-on: ubuntu-latest
    outputs:
      accuracy: ${{ steps.read_metrics.outputs.accuracy }}
      f1_score: ${{ steps.read_metrics.outputs.f1_score }}
      prev_accuracy: ${{ steps.prev_metrics.outputs.prev_accuracy }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Authenticate to S3
        env:
          CLOUD_CREDENTIALS: ${{ secrets.CLOUD_CREDENTIALS }}
        run: |
          python - <<'EOF'
          import json, os

          creds = json.loads(os.environ["CLOUD_CREDENTIALS"])
          key_id = creds["aws_access_key_id"]
          secret = creds["aws_secret_access_key"]
          region = creds.get("region", "us-east-1")

          # Che gia tri trong log phong khi buoc sau lo in ra
          print(f"::add-mask::{key_id}")
          print(f"::add-mask::{secret}")

          with open(os.environ["GITHUB_ENV"], "a") as f:
              f.write(f"AWS_ACCESS_KEY_ID={key_id}\n")
              f.write(f"AWS_SECRET_ACCESS_KEY={secret}\n")
              f.write(f"AWS_DEFAULT_REGION={region}\n")

          print(f"Da cau hinh credentials AWS, region={region}")
          EOF

      - name: Read metrics of currently deployed model
        id: prev_metrics
        env:
          CLOUD_BUCKET: ${{ secrets.CLOUD_BUCKET }}
        run: |
          if aws s3 cp "s3://$CLOUD_BUCKET/metrics/latest.json" /tmp/prev.json 2>/dev/null; then
            PREV=$(python -c "import json; print(json.load(open('/tmp/prev.json'))['accuracy'])")
            echo "Model dang chay tren VM co accuracy = $PREV"
          else
            PREV=""
            echo "Chua co metrics tren S3 - day la lan chay dau tien."
          fi
          echo "prev_accuracy=$PREV" >> $GITHUB_OUTPUT

      - name: Pull data with DVC
        # Chi keo train_phase1 va eval - train_phase2 khong can cho viec huan luyen
        run: dvc pull data/train_phase1.csv.dvc data/eval.csv.dvc

      - name: Train model
        run: python src/train.py

      - name: Read metrics
        id: read_metrics
        run: |
          python - <<'EOF'
          import json, os

          m = json.load(open("outputs/metrics.json"))
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"accuracy={m['accuracy']}\n")
              f.write(f"f1_score={m['f1_score']}\n")

          print(f"accuracy = {m['accuracy']:.4f} | f1_score = {m['f1_score']:.4f}")
          print(f"model_type = {m['model_type']}")
          print(f"phan bo nhan = {m['label_distribution']}")
          EOF

      - name: Upload candidate model to S3
        env:
          CLOUD_BUCKET: ${{ secrets.CLOUD_BUCKET }}
        run: |
          python - <<'EOF'
          import os
          import boto3

          bucket = os.environ["CLOUD_BUCKET"]
          key = "models/candidate/model.pkl"

          boto3.client("s3").upload_file("models/model.pkl", bucket, key)
          print(f"Da upload -> s3://{bucket}/{key}")
          print("Chua ghi de models/latest - cho qua eval gate da.")
          EOF

      - name: Save metrics and report as artifacts
        uses: actions/upload-artifact@v4
        with:
          name: metrics
          path: |
            outputs/metrics.json
            outputs/report.txt


  # ---------------------------------------------------------------------------
  # JOB 3 - EVAL
  # Hai cong chat luong:
  #   1. Nguong tuyet doi: accuracy >= EVAL_THRESHOLD.
  #   2. Chong tut hang: accuracy moi khong duoc thap hon model dang chay.
  # Pipeline dung lai o day neu mot trong hai cong khong qua.
  # Chi chay khi Job 2 (Train) hoan thanh thanh cong.
  # ---------------------------------------------------------------------------
  eval:
    name: Eval
    needs: train
    runs-on: ubuntu-latest
    steps:

      - name: Check eval gate
        env:
          ACCURACY: ${{ needs.train.outputs.accuracy }}
          F1_SCORE: ${{ needs.train.outputs.f1_score }}
          PREV_ACCURACY: ${{ needs.train.outputs.prev_accuracy }}
        run: |
          python - <<'EOF'
          import os

          # Output cua GitHub Actions luon la chuoi - bat buoc phai float()
          acc = float(os.environ["ACCURACY"])
          f1 = float(os.environ["F1_SCORE"])
          threshold = float(os.environ["EVAL_THRESHOLD"])
          prev_raw = os.environ.get("PREV_ACCURACY", "").strip()

          print(f"accuracy  = {acc:.4f}")
          print(f"f1_score  = {f1:.4f}")
          print(f"threshold = {threshold:.2f}")
          print()

          # Cong 1 - nguong chat luong tuyet doi
          if acc < threshold:
              raise SystemExit(
                  f"FAILED: accuracy {acc:.4f} < {threshold:.2f}. Huy deploy."
              )
          print(f"PASSED cong 1 - dat nguong: {acc:.4f} >= {threshold:.2f}")

          # Cong 2 - chong tut hang so voi model dang phuc vu
          if prev_raw:
              prev = float(prev_raw)
              print(f"Model dang chay: {prev:.4f} -> model moi: {acc:.4f} "
                    f"({acc - prev:+.4f})")
              if acc < prev:
                  raise SystemExit(
                      f"FAILED: model moi kem hon model dang chay "
                      f"({acc:.4f} < {prev:.4f}). Giu nguyen ban cu, huy deploy."
                  )
              print("PASSED cong 2 - khong tut hang so voi ban cu.")
          else:
              print("Chua co model nao dang chay - bo qua cong 2.")

          print()
          print("Ca hai cong deu qua, tien hanh trien khai.")
          EOF


  # ---------------------------------------------------------------------------
  # JOB 4 - DEPLOY
  # Promote candidate len latest roi restart service tren EC2.
  # Chi chay khi Job 3 (Eval) hoan thanh thanh cong.
  # ---------------------------------------------------------------------------
  deploy:
    name: Deploy
    needs: [train, eval]
    runs-on: ubuntu-latest
    steps:

      - name: Authenticate to S3
        env:
          CLOUD_CREDENTIALS: ${{ secrets.CLOUD_CREDENTIALS }}
        run: |
          python3 - <<'EOF'
          import json, os

          creds = json.loads(os.environ["CLOUD_CREDENTIALS"])
          key_id = creds["aws_access_key_id"]
          secret = creds["aws_secret_access_key"]
          region = creds.get("region", "us-east-1")

          print(f"::add-mask::{key_id}")
          print(f"::add-mask::{secret}")

          with open(os.environ["GITHUB_ENV"], "a") as f:
              f.write(f"AWS_ACCESS_KEY_ID={key_id}\n")
              f.write(f"AWS_SECRET_ACCESS_KEY={secret}\n")
              f.write(f"AWS_DEFAULT_REGION={region}\n")
          EOF

      - name: Promote candidate model to latest
        env:
          CLOUD_BUCKET: ${{ secrets.CLOUD_BUCKET }}
          ACCURACY: ${{ needs.train.outputs.accuracy }}
          F1_SCORE: ${{ needs.train.outputs.f1_score }}
        run: |
          aws s3 cp "s3://$CLOUD_BUCKET/models/candidate/model.pkl" \
                    "s3://$CLOUD_BUCKET/models/latest/model.pkl"

          python3 - <<'EOF'
          import json, os
          json.dump(
              {"accuracy": float(os.environ["ACCURACY"]),
               "f1_score": float(os.environ["F1_SCORE"])},
              open("/tmp/latest.json", "w"),
          )
          EOF

          aws s3 cp /tmp/latest.json "s3://$CLOUD_BUCKET/metrics/latest.json"
          echo "Da promote candidate -> latest, va ghi lai metrics de lan sau doi chieu."

      - name: SSH deploy to VM
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            set -e
            sudo systemctl restart mlops-serve

            # Server phai tai model tu S3 khi khoi dong nen can cho, khong
            # dung sleep co dinh: thu lai toi da 10 lan, moi lan cach 3 giay.
            for i in $(seq 1 10); do
              sleep 3
              if curl -sf http://localhost:8000/health; then
                echo ""
                echo "Health check passed sau $((i * 3)) giay."
                exit 0
              fi
              echo "Server chua san sang, thu lai ($i/10)..."
            done

            echo "Health check FAILED - log 30 dong cuoi cua service:"
            sudo journalctl -u mlops-serve -n 30 --no-pager
            exit 1
